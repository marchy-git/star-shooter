# ทดสอบในเครื่อง:   docker compose up dev            แล้วเปิด http://localhost:8788
# สร้างตารางในเครื่อง: docker compose run --rm tool d1 execute star-shooter --local --file=schema.sql
# deploy:          ดู README.md (ใช้ CLOUDFLARE_API_TOKEN และ CLOUDFLARE_ACCOUNT_ID ในไฟล์ .env)
services:
  dev:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8788:8788"
    command: >
      sh -c "wrangler d1 execute star-shooter --local --file=schema.sql &&
             wrangler pages dev public --ip 0.0.0.0 --port 8788"

  tool:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    entrypoint: ["wrangler"]

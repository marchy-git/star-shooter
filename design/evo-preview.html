<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolution Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #05030f; color: #e8f3ff; font-family: "Chakra Petch", system-ui, sans-serif; }
  #wrap { max-width: 1000px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// หน้าพรีวิวการแปลงร่างยาน (ร่าง 2) — ใช้ตัววาดแบบเดียวกับในเกม · เปิดไฟล์นี้ตรงๆ ในเบราว์เซอร์ได้เลย (ไม่ได้ deploy)
const W = 1000, H = 1640;
const FONT = '"Chakra Petch", system-ui, sans-serif';
const TIER = { rare: 0x36f1ff, epic: 0xc18bff, legendary: 0xffd23f, mythic: 0xff3b3b };
const SHIPS = [
  { id: 'magneto', name: 'แม็กเนโต',  tier: 'rare',      color: 0xff5a3c, alt: 0x36f1ff, fx: 'ขดลวดแม่เหล็กสองข้าง มีประกายไฟฟ้าวิ่ง' },
  { id: 'falcon',  name: 'เหยี่ยว',   tier: 'rare',      color: 0x7dff6a, alt: 0xd8ff6a, fx: 'ปีกขนนกซ้อน 3 ชั้น กางกว้าง' },
  { id: 'comet',   name: 'ดาวหาง',   tier: 'rare',      color: 0x9ff3ff, alt: 0xffffff, fx: 'หัวผลึกน้ำแข็ง หางดาวหางยาว' },
  { id: 'storm',   name: 'พายุ',     tier: 'rare',      color: 0xff4fd8, alt: 0xfff35a, fx: 'ปีกสายฟ้า ฟ้าผ่าคู่กลางลำ' },
  { id: 'phantom', name: 'แฟนทอม',  tier: 'epic',      color: 0xb46bff, alt: 0xffd23f, fx: 'ผ้าคลุมพลิ้ว 5 แฉก เขาจันทร์เสี้ยว ตาทอง' },
  { id: 'prism',   name: 'ปริซึม',   tier: 'epic',      color: 0xffffff, alt: 0x36f1ff, fx: 'สามเหลี่ยมซ้อนเป็นดาว 6 แฉก ขอบสีรุ้ง' },
  { id: 'nova',    name: 'โนวา',     tier: 'legendary', color: 0xffd23f, alt: 0xfff3b0, fx: 'ดาวซ้อน 2 ชั้น + ดาวบริวาร 4 ดวงโคจร' },
  { id: 'phoenix', name: 'ฟีนิกซ์',  tier: 'mythic',    color: 0xff3b3b, alt: 0xffb84d, fx: 'ปีกเพลิงซ้อน + มงกุฎหงอนไฟ' },
];

function makeTextures(scene) {
  const draw = (key, w, h, fn) => { const g = scene.make.graphics({ x: 0, y: 0, add: false }); fn(g); g.generateTexture(key, w, h); g.destroy(); };
  const P = arr => arr.map(([x, y]) => ({ x, y }));
  const poly = (cx, cy, radii, rot = 0) => radii.map((r, i) => { const a = rot + i / radii.length * Math.PI * 2; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
  const star = (cx, cy, r1, r2, n, rot = -Math.PI / 2) => poly(cx, cy, Array.from({ length: n * 2 }, (_, i) => (i % 2 ? r2 : r1)), rot);
  const neon = (g, pts, color, fill = 0.16) => {
    g.lineStyle(8, color, 0.12); g.strokePoints(pts, true, true);
    g.lineStyle(5, color, 0.3); g.strokePoints(pts, true, true);
    g.fillStyle(color, fill); g.fillPoints(pts, true);
    g.lineStyle(2.5, color, 1); g.strokePoints(pts, true, true);
    g.lineStyle(1, 0xffffff, 0.75); g.strokePoints(pts, true, true);
  };
  const ring = (g, x, y, r, color, fill = 0.16) => {
    g.lineStyle(8, color, 0.12); g.strokeCircle(x, y, r);
    g.lineStyle(5, color, 0.3); g.strokeCircle(x, y, r);
    g.fillStyle(color, fill); g.fillCircle(x, y, r);
    g.lineStyle(2.5, color, 1); g.strokeCircle(x, y, r);
    g.lineStyle(1, 0xffffff, 0.75); g.strokeCircle(x, y, r);
  };
  const line = (g, x1, y1, x2, y2, color, w = 2.5) => { g.lineStyle(w + 4, color, 0.2); g.lineBetween(x1, y1, x2, y2); g.lineStyle(w, color, 1); g.lineBetween(x1, y1, x2, y2); };
  const core = (g, x, y, r = 3) => { g.fillStyle(0xffffff, 1); g.fillCircle(x, y, r); };
  // เลื่อน/ขยายจุดของร่างเดิม (64) ไปไว้กลางผืน 96
  const S = (arr, k = 1.25) => P(arr.map(([x, y]) => [48 + (x - 32) * k, 48 + (y - 32) * k]));
  const M = arr => arr.map(([x, y]) => [96 - x, y]);   // กลับซ้าย-ขวา

  // ----- ร่างเดิม (เหมือนในเกม) -----
  draw('ship_magneto', 64, 64, g => { neon(g, P([[32, 6], [52, 22], [52, 54], [40, 54], [40, 28], [32, 20], [24, 28], [24, 54], [12, 54], [12, 22]]), 0xff5a3c, 0.18); g.fillStyle(0xffffff, 1); g.fillRect(12, 48, 12, 6); g.fillRect(40, 48, 12, 6); core(g, 32, 12, 3); });
  draw('ship_falcon', 64, 64, g => { neon(g, P([[22, 6], [28, 38], [36, 38], [42, 6], [54, 54], [32, 46], [10, 54]]), 0x7dff6a); core(g, 32, 40, 2.5); });
  draw('ship_comet', 64, 64, g => { neon(g, P([[32, 4], [44, 38], [56, 58], [32, 48], [8, 58], [20, 38]]), 0x9ff3ff, 0.16); line(g, 32, 48, 32, 62, 0x9ff3ff, 2); line(g, 22, 50, 18, 62, 0x9ff3ff, 1.5); line(g, 42, 50, 46, 62, 0x9ff3ff, 1.5); core(g, 32, 24, 3); });
  draw('ship_storm', 64, 64, g => { neon(g, P([[32, 4], [58, 50], [40, 44], [32, 58], [24, 44], [6, 50]]), 0xff4fd8); g.lineStyle(2.5, 0xfff35a, 1); g.beginPath(); g.moveTo(35, 16); g.lineTo(27, 30); g.lineTo(36, 30); g.lineTo(28, 44); g.strokePath(); });
  draw('ship_phantom', 64, 64, g => { neon(g, P([[32, 6], [50, 28], [48, 58], [40, 50], [32, 58], [24, 50], [16, 58], [14, 28]]), 0xb46bff, 0.1); g.fillStyle(0xffffff, 1); g.fillCircle(26, 28, 3); g.fillCircle(38, 28, 3); });
  draw('ship_prism', 64, 64, g => { neon(g, P([[32, 6], [58, 54], [6, 54]]), 0xffffff, 0.06); line(g, 32, 14, 20, 48, 0xff3df2, 2); line(g, 32, 14, 32, 48, 0xfff35a, 2); line(g, 32, 14, 44, 48, 0x36f1ff, 2); core(g, 32, 34, 3); });
  draw('ship_nova', 64, 64, g => { neon(g, star(32, 32, 28, 12, 5), 0xffd23f, 0.2); ring(g, 32, 32, 8, 0xfff3b0, 0.4); core(g, 32, 32, 3); });
  draw('ship_phoenix', 64, 64, g => { neon(g, P([[32, 4], [40, 22], [62, 16], [48, 38], [56, 58], [32, 46], [8, 58], [16, 38], [2, 16], [24, 22]]), 0xff3b3b, 0.22); neon(g, P([[32, 14], [38, 30], [32, 40], [26, 30]]), 0xffb84d, 0.4); core(g, 32, 28, 3); });

  // ----- ร่าง 2 (96x96) -----
  draw('ship2_magneto', 96, 96, g => {
    // ขดลวดสองข้าง
    for (const s of [-1, 1]) {
      const x = 48 + s * 34;
      neon(g, P([[x - 6, 30], [x + 6, 30], [x + 6, 78], [x - 6, 78]]), 0x36f1ff, 0.12);
      for (let y = 36; y <= 72; y += 8) line(g, x - 6, y, x + 6, y + 3, 0x9ff3ff, 1.2);
    }
    neon(g, S([[32, 6], [52, 22], [52, 54], [40, 54], [40, 28], [32, 20], [24, 28], [24, 54], [12, 54], [12, 22]]), 0xff5a3c, 0.2);
    g.fillStyle(0xffd23f, 1); g.fillRect(23, 75, 15, 6); g.fillRect(58, 75, 15, 6);
    neon(g, P([[48, 8], [54, 16], [48, 22], [42, 16]]), 0xffd23f, 0.35);
    core(g, 48, 15, 3);
  });
  draw('ship2_falcon', 96, 96, g => {
    // ปีกขนนกกวาดไปข้างหลัง ข้างละผืนเดียว ปลายหยักเป็นขนนก 3 เส้น
    for (const s of [-1, 1]) {
      const X = x => 48 + s * (48 - x);
      neon(g, P([[X(42), 40], [X(4), 18], [X(14), 32], [X(2), 40], [X(14), 48], [X(6), 60], [X(40), 58]]), 0x7dff6a, 0.1);
      line(g, X(40), 42, X(8), 22, 0xffd23f, 1.5);
    }
    neon(g, S([[22, 6], [28, 38], [36, 38], [42, 6], [54, 54], [32, 46], [10, 54]], 1.0), 0x7dff6a, 0.22);
    neon(g, P([[48, 14], [52, 24], [48, 30], [44, 24]]), 0xffd23f, 0.4);
    core(g, 48, 50, 3);
  });
  draw('ship2_comet', 96, 96, g => {
    for (const [x2, w] of [[48, 3], [32, 2], [64, 2], [22, 1.2], [74, 1.2]]) line(g, 48 + (x2 - 48) * 0.4, 70, x2, 95, 0x9ff3ff, w);
    neon(g, S([[32, 4], [44, 38], [56, 58], [32, 48], [8, 58], [20, 38]], 1.3), 0x9ff3ff, 0.18);
    neon(g, P([[48, 2], [58, 22], [48, 34], [38, 22]]), 0xffffff, 0.45);
    ring(g, 48, 46, 9, 0x6fe3ff, 0.3);
    core(g, 48, 46, 3.5);
  });
  draw('ship2_storm', 96, 96, g => {
    // ปีกเป็นใบมีดรูปสายฟ้า ข้างละผืน + ฟ้าผ่าเส้นใหญ่กลางลำ
    for (const s of [-1, 1]) {
      const X = x => 48 + s * (48 - x);
      neon(g, P([[X(42), 34], [X(8), 22], [X(24), 40], [X(4), 54], [X(28), 54], [X(18), 72], [X(42), 58]]), 0xff4fd8, 0.12);
    }
    neon(g, S([[32, 4], [58, 50], [40, 44], [32, 58], [24, 44], [6, 50]], 1.1), 0xff4fd8, 0.22);
    const bolt = [[54, 16], [42, 40], [53, 40], [41, 66]];
    g.lineStyle(9, 0xfff35a, 0.2); g.strokePoints(P(bolt), false);
    g.lineStyle(4, 0xfff35a, 1); g.strokePoints(P(bolt), false);
    g.lineStyle(1.5, 0xffffff, 0.9); g.strokePoints(P(bolt), false);
  });
  draw('ship2_phantom', 96, 96, g => {
    neon(g, P([[30, 56], [20, 94], [34, 80], [41, 96], [48, 82], [55, 96], [62, 80], [76, 94], [66, 56]]), 0x7a3bd6, 0.14);
    neon(g, S([[32, 6], [50, 28], [48, 58], [40, 50], [32, 58], [24, 50], [16, 58], [14, 28]], 1.2), 0xb46bff, 0.14);
    g.lineStyle(6, 0xffd23f, 0.25); g.beginPath(); g.arc(48, 22, 20, Math.PI * 1.15, Math.PI * 1.85); g.strokePath();
    g.lineStyle(2.5, 0xffd23f, 1); g.beginPath(); g.arc(48, 22, 20, Math.PI * 1.15, Math.PI * 1.85); g.strokePath();
    for (const x of [40, 56]) { g.fillStyle(0xffd23f, 0.35); g.fillCircle(x, 42, 6); g.fillStyle(0xfff3b0, 1); g.fillCircle(x, 42, 3.5); }
  });
  draw('ship2_prism', 96, 96, g => {
    neon(g, P([[48, 92], [90, 22], [6, 22]]), 0xffffff, 0.04);
    neon(g, P([[48, 4], [90, 74], [6, 74]]), 0xffffff, 0.06);
    const rb = [0xff3df2, 0xffb84d, 0xfff35a, 0x7dff6a, 0x36f1ff, 0xb46bff];
    const hexPts = [[48, 4], [90, 74], [6, 74]];
    hexPts.forEach((p, i) => line(g, p[0], p[1], hexPts[(i + 1) % 3][0], hexPts[(i + 1) % 3][1], rb[i * 2], 1.5));
    line(g, 48, 16, 30, 66, 0xff3df2, 2); line(g, 48, 16, 48, 66, 0xfff35a, 2); line(g, 48, 16, 66, 66, 0x36f1ff, 2);
    ring(g, 48, 48, 8, 0xffffff, 0.3);
    core(g, 48, 48, 3.5);
  });
  draw('ship2_nova', 96, 96, g => {
    neon(g, star(48, 48, 46, 30, 10, -Math.PI / 2), 0xffb84d, 0.08);
    neon(g, star(48, 48, 36, 15, 5), 0xffd23f, 0.22);
    ring(g, 48, 48, 11, 0xfff3b0, 0.45);
    core(g, 48, 48, 4);
  });
  draw('ship2_phoenix', 96, 96, g => {
    for (const s of [-1, 1]) {
      neon(g, P([[48, 40], [48 + s * 46, 8], [48 + s * 36, 32], [48 + s * 48, 40], [48 + s * 34, 52], [48 + s * 42, 70], [48 + s * 14, 58]]), 0xffb84d, 0.12);
    }
    neon(g, S([[32, 4], [40, 22], [62, 16], [48, 38], [56, 58], [32, 46], [8, 58], [16, 38], [2, 16], [24, 22]], 1.15), 0xff3b3b, 0.24);
    neon(g, P([[48, 18], [55, 38], [48, 52], [41, 38]]), 0xfff35a, 0.45);
    neon(g, P([[40, 10], [44, 2], [48, 9], [52, 2], [56, 10], [48, 16]]), 0xffd23f, 0.4);
    core(g, 48, 36, 3.5);
  });

  // ----- เอฟเฟกต์ -----
  draw('halo', 160, 160, g => {   // วงแหวนขีดๆ หมุนอยู่หลังยาน
    for (let i = 0; i < 24; i++) {
      const a0 = i / 24 * Math.PI * 2, a1 = a0 + Math.PI / 24;
      g.lineStyle(i % 3 === 0 ? 4 : 2, 0xffffff, i % 3 === 0 ? 0.9 : 0.5);
      g.beginPath(); g.arc(80, 80, 72, a0, a1); g.strokePath();
    }
    g.lineStyle(1.5, 0xffffff, 0.35); g.strokeCircle(80, 80, 60);
  });
  draw('glow', 64, 64, g => { for (let i = 10; i > 0; i--) { g.fillStyle(0xffffff, 0.05); g.fillCircle(32, 32, i * 3.2); } });
  draw('spark', 8, 8, g => { g.fillStyle(0xffffff, 1); g.fillCircle(4, 4, 3); });
  const bolt = (key, w, h, color) => draw(key, w, h, g => { g.fillStyle(color, 0.35); g.fillRoundedRect(0, 0, w, h, w / 2 - 0.5); g.fillStyle(0xffffff, 1); g.fillRoundedRect(w / 2 - 1, 2, 2, h - 4, 1); });
  bolt('bullet', 8, 22, 0x36f1ff);
  // กระสุนร่าง 2: หัวเพชรเรืองแสง ตัวยาวขึ้น
  draw('bullet2', 16, 34, g => {
    g.fillStyle(0xffffff, 0.12); g.fillRoundedRect(0, 4, 16, 30, 8);
    g.fillStyle(0xffffff, 0.35); g.fillRoundedRect(3, 6, 10, 26, 5);
    g.fillStyle(0xffffff, 1); g.fillPoints(P([[8, 0], [12, 8], [8, 14], [4, 8]]), true);
    g.fillRoundedRect(7, 10, 2, 22, 1);
  });
  draw('shard', 28, 36, g => { neon(g, P([[14, 2], [24, 14], [18, 34], [8, 30], [4, 12]]), 0xffffff, 0.3); g.lineStyle(1.5, 0xffffff, 0.8); g.lineBetween(14, 6, 13, 30); });
}

class Preview extends Phaser.Scene {
  constructor() { super('p'); }
  create() {
    makeTextures(this);
    const g = this.add.graphics();
    for (let x = 0; x <= W; x += 50) { g.lineStyle(1, 0x2a1a5a, 0.5); g.lineBetween(x, 0, x, H); }
    for (let y = 0; y <= H; y += 50) { g.lineStyle(1, 0x2a1a5a, 0.5); g.lineBetween(0, y, W, y); }
    this.add.text(W / 2, 38, 'ร่าง 2 · แปลงร่างยาน (พรีวิว)', { fontFamily: FONT, fontSize: 40, fontStyle: '700', color: '#ffffff' }).setOrigin(0.5).setShadow(0, 0, '#ff3df2', 16, true, true);
    this.add.text(W / 2, 80, 'ซ้าย = ร่างปัจจุบัน + กระสุนเดิม   ·   ขวา = ร่าง 2 + กระสุนใหม่ + เอฟเฟกต์', { fontFamily: FONT, fontSize: 18, color: '#a9b9d6' }).setOrigin(0.5);

    this.cards = [];
    SHIPS.forEach((s, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const cx = 250 + col * 500, cy = 250 + row * 300;
      this.card(s, cx, cy);
    });
    this.evolveDemo(W / 2, 1500);
  }

  card(s, cx, cy) {
    const tierC = TIER[s.tier];
    const box = this.add.graphics();
    box.fillStyle(0x0c0820, 0.85).fillRoundedRect(cx - 235, cy - 140, 470, 280, 18);
    box.lineStyle(2, tierC, 0.7).strokeRoundedRect(cx - 235, cy - 140, 470, 280, 18);
    this.add.text(cx - 215, cy - 128, s.name, { fontFamily: FONT, fontSize: 24, fontStyle: '700', color: '#' + tierC.toString(16).padStart(6, '0') });
    this.add.text(cx + 30, cy - 128, s.fx, { fontFamily: FONT, fontSize: 14, color: '#c3d3ee', wordWrap: { width: 200 }, align: 'right' }).setOrigin(0, 0);
    this.add.text(cx - 120, cy - 92, 'ร่าง 1', { fontFamily: FONT, fontSize: 14, color: '#7f8db0' }).setOrigin(0.5);
    this.add.text(cx + 105, cy - 92, 'ร่าง 2', { fontFamily: FONT, fontSize: 14, color: '#ffe9b0' }).setOrigin(0.5);

    // ร่าง 1
    const x1 = cx - 120, y1 = cy + 62;
    const a = this.add.image(x1, y1, 'ship_' + s.id).setScale(1.3);
    this.tweens.add({ targets: a, y: y1 - 4, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.time.addEvent({ delay: 220, loop: true, callback: () => this.shoot(a.x, a.y - 40, 'bullet', 0x36f1ff, false, cy - 130) });

    // ร่าง 2
    const x2 = cx + 105, y2 = cy + 52;
    const glow = this.add.image(x2, y2, 'glow').setTint(tierC).setBlendMode('ADD').setScale(2.6).setAlpha(0.55);
    const halo = this.add.image(x2, y2, 'halo').setTint(tierC).setBlendMode('ADD').setScale(0.82).setAlpha(0.7);
    this.tweens.add({ targets: halo, angle: 360, duration: 6000, repeat: -1 });
    this.tweens.add({ targets: [glow], alpha: 0.25, scale: 2.2, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    // ไอพ่นคู่
    const trail = this.add.particles(0, 0, 'spark', {
      speedY: { min: 120, max: 220 }, speedX: { min: -20, max: 20 }, lifespan: 420, scale: { start: 0.9, end: 0 },
      alpha: { start: 0.9, end: 0 }, tint: [tierC, s.color, 0xffffff], blendMode: 'ADD', frequency: 30, quantity: 2,
    });
    const b = this.add.image(x2, y2, 'ship2_' + s.id).setScale(1.25);
    // ของโคจร (โนวา) / ประกายไฟ (แม็กเนโต)
    if (s.id === 'nova') {
      const sats = [0, 1, 2, 3].map(() => this.add.image(x2, y2, 'spark').setTint(0xfff3b0).setBlendMode('ADD').setScale(1.6));
      this.events.on('update', (t) => sats.forEach((o, k) => { const ang = t / 600 + k * Math.PI / 2; o.setPosition(b.x + Math.cos(ang) * 66, b.y + Math.sin(ang) * 66 * 0.45); }));
    }
    this.tweens.add({ targets: [b], y: y2 - 5, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
      onUpdate: () => { halo.y = glow.y = b.y; trail.setPosition(b.x, b.y + 50); } });
    let n = 0;
    this.time.addEvent({ delay: 180, loop: true, callback: () => {
      n++;
      for (const ox of [-10, 10]) this.shoot(b.x + ox, b.y - 50, 'bullet2', s.color === 0xffffff ? 0xc8f6ff : s.color, true, cy - 130);
      if (n % 4 === 0) for (const sd of [-1, 1]) this.shoot(b.x + sd * 40, b.y - 20, 'bullet2', s.alt, true, cy - 130, sd * 140);
    } });
  }

  shoot(x, y, key, tint, fancy, topY, vx = 0) {
    const o = this.add.image(x, y, key).setTint(tint).setBlendMode(fancy ? 'ADD' : 'NORMAL');
    if (vx) o.rotation = Math.atan2(-700, vx) + Math.PI / 2;
    const dist = y - topY;
    const dur = dist / 0.45;
    this.tweens.add({ targets: o, y: topY, x: x + vx * dur / 1000, duration: dur, onComplete: () => {
      if (fancy) {
        const r = this.add.image(o.x, o.y, 'spark').setTint(tint).setBlendMode('ADD').setScale(1);
        this.tweens.add({ targets: r, scale: 3.2, alpha: 0, duration: 260, onComplete: () => r.destroy() });
      }
      o.destroy();
    } });
    if (fancy) {
      const tr = this.add.particles(0, 0, 'spark', { follow: o, lifespan: 220, scale: { start: 0.5, end: 0 }, alpha: { start: 0.7, end: 0 }, tint, blendMode: 'ADD', frequency: 40 });
      this.time.delayedCall(dur, () => tr.destroy());
    }
  }

  // ตัวอย่างตอนเก็บเศษครบ 5/5 → แปลงร่าง (วนซ้ำ ลำละรอบ)
  evolveDemo(cx, cy) {
    const box = this.add.graphics();
    box.fillStyle(0x0c0820, 0.9).fillRoundedRect(cx - 485, cy - 120, 970, 240, 18);
    box.lineStyle(2, 0xff3df2, 0.7).strokeRoundedRect(cx - 485, cy - 120, 970, 240, 18);
    this.add.text(cx - 465, cy - 108, 'ตอนเก็บเศษยานครบ 5/5 (ในเกม: พรีวิวเต็มจอ แล้วยานในเกมเปลี่ยนร่างทันที)', { fontFamily: FONT, fontSize: 18, fontStyle: '700', color: '#ffffff' });
    const label = this.add.text(cx + 200, cy - 40, '', { fontFamily: FONT, fontSize: 26, fontStyle: '700', color: '#ffffff', align: 'center' }).setOrigin(0.5);
    const count = this.add.text(cx + 200, cy + 20, '', { fontFamily: FONT, fontSize: 40, fontStyle: '700', color: '#ffd23f' }).setOrigin(0.5);
    const sx = cx - 230, sy = cy + 10;
    const ship = this.add.image(sx, sy, 'ship_magneto').setScale(1.5);
    const halo = this.add.image(sx, sy, 'halo').setBlendMode('ADD').setScale(0.9).setAlpha(0);
    this.tweens.add({ targets: halo, angle: 360, duration: 5000, repeat: -1 });
    let idx = 0;
    const run = () => {
      const s = SHIPS[idx++ % SHIPS.length], c = TIER[s.tier];
      ship.setTexture('ship_' + s.id).setScale(1.5).setAlpha(1); halo.setAlpha(0).setTint(c);
      label.setText(s.name).setColor('#' + c.toString(16).padStart(6, '0')); count.setText('0/5');
      for (let k = 0; k < 5; k++) {
        this.time.delayedCall(300 + k * 380, () => {
          const sh = this.add.image(sx + Phaser.Math.Between(-300, 300), sy - 140, 'shard').setTint(c).setBlendMode('ADD');
          this.tweens.add({ targets: sh, x: sx, y: sy, angle: 360, scale: 0.4, duration: 420, ease: 'Cubic.easeIn', onComplete: () => {
            sh.destroy(); count.setText(`${k + 1}/5`);
            const r = this.add.image(sx, sy, 'halo').setTint(c).setBlendMode('ADD').setScale(0.3);
            this.tweens.add({ targets: r, scale: 1.2, alpha: 0, duration: 380, onComplete: () => r.destroy() });
          } });
        });
      }
      this.time.delayedCall(2500, () => {
        this.cameras.main.flash(300, 255, 255, 255);
        const col = Phaser.Display.Color.IntegerToColor(c);
        for (let i = 0; i < 10; i++) {
          const r = this.add.image(sx, sy, 'halo').setTint(i % 2 ? c : 0xffffff).setBlendMode('ADD').setScale(0.1);
          this.tweens.add({ targets: r, scale: 2.2, alpha: 0, duration: 800, delay: i * 50, onComplete: () => r.destroy() });
        }
        ship.setTexture('ship2_' + s.id).setScale(0.4);
        this.tweens.add({ targets: ship, scale: 1.5, duration: 500, ease: 'Back.easeOut' });
        halo.setAlpha(0.8);
        label.setText(`${s.name}\nแปลงร่างสำเร็จ!`); count.setText('ร่าง 2');
      });
      this.time.delayedCall(5200, run);
    };
    run();
  }
}

new Phaser.Game({
  type: Phaser.AUTO, parent: 'wrap', width: W, height: H, backgroundColor: '#05030f',
  scene: Preview,
});

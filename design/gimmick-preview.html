<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obstacle Gimmicks</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #05030f; color: #e8f3ff; font-family: "Chakra Petch", system-ui, sans-serif; }
  #wrap { max-width: 1000px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// พรีวิวกิมมิคสิ่งกีดขวาง 7 แบบ (ยิงไม่แตก ต้องหลบ) · เปิดไฟล์ตรงๆ ได้ ไม่ได้ deploy
const W = 1000, PW = 236, PH = 430, GAP = 12, TOP = 150, ROWGAP = 92;
const FONT = '"Chakra Petch", system-ui, sans-serif';
const RED = 0xff3b4f, RED2 = 0xff7a8a;
const GIMMICKS = [
  { name: '1. ทางเดินกำแพงพลังงาน', note: 'กำแพงคดเคี้ยวเลื่อนลงมา ชน = โดน' },
  { name: '2. ประตูเลเซอร์', note: 'รั้วเต็มจอ มีช่องเดียว เส้นเตือนก่อน' },
  { name: '3. ม่านกระสุนมีช่อง', note: 'กระสุนแถวยาว เว้นช่องให้ลอด' },
  { name: '4. เขตเตือนภัยถล่ม', note: 'แถบแดงเตือน 1 วิ แล้วลำแสงถล่ม' },
  { name: '5. ทุ่นระเบิดลอย', note: 'ยิงไม่แตก ยิงได้แค่ผลักกระเด็น' },
  { name: '6. หลุมดำดูด', note: 'ดูดยานเข้าหา ต้องขับฝืน' },
  { name: '7. แผ่นหินบังกระสุน', note: 'บังกระสุนเรา ต้องหามุมยิง' },
];

function makeTextures(scene) {
  const draw = (key, w, h, fn) => { const g = scene.make.graphics({ x: 0, y: 0, add: false }); fn(g); g.generateTexture(key, w, h); g.destroy(); };
  const P = arr => arr.map(([x, y]) => ({ x, y }));
  draw('ship', 64, 64, g => {
    const pts = P([[32, 6], [54, 52], [32, 42], [10, 52]]);
    g.lineStyle(5, 0x36f1ff, 0.3); g.strokePoints(pts, true, true);
    g.fillStyle(0x36f1ff, 0.16); g.fillPoints(pts, true);
    g.lineStyle(2.5, 0x36f1ff, 1); g.strokePoints(pts, true, true);
    g.fillStyle(0xffffff, 1); g.fillCircle(32, 30, 3);
  });
  draw('bullet', 8, 22, g => { g.fillStyle(0x36f1ff, 0.35); g.fillRoundedRect(0, 0, 8, 22, 3.5); g.fillStyle(0xffffff, 1); g.fillRoundedRect(3, 2, 2, 18, 1); });
  draw('ebullet', 22, 44, g => {
    for (let i = 0; i < 7; i++) { g.fillStyle(0xff4f6a, 0.06 + i * 0.05); g.fillEllipse(11, 3 + i * 2.6, 5 + i * 0.9, 7); }
    g.fillStyle(0x000000, 0.85); g.fillPoints(P([[11, 35], [20, 22], [11, 10], [2, 22]]), true);
    g.fillStyle(0xff3b4f, 1); g.fillPoints(P([[11, 33], [18, 22], [11, 12], [4, 22]]), true);
    g.fillStyle(0xffffff, 1); g.fillCircle(11, 22, 2.4);
  });
  draw('enemy', 40, 40, g => {
    const pts = P([[20, 4], [36, 20], [20, 36], [4, 20]]);
    g.lineStyle(5, 0xff4f8b, 0.3); g.strokePoints(pts, true, true);
    g.lineStyle(2.5, 0xff4f8b, 1); g.strokePoints(pts, true, true);
    g.fillStyle(0xffffff, 1); g.fillCircle(20, 20, 3);
  });
  draw('mine', 40, 40, g => {   // ทุ่นระเบิด: วงแดงมีหนาม แกนเหลืองกะพริบ
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; g.lineStyle(3, RED, 1); g.lineBetween(20 + Math.cos(a) * 11, 20 + Math.sin(a) * 11, 20 + Math.cos(a) * 18, 20 + Math.sin(a) * 18); }
    g.fillStyle(0x000000, 0.9); g.fillCircle(20, 20, 12);
    g.lineStyle(3, RED, 1); g.strokeCircle(20, 20, 11);
    g.fillStyle(0xffd23f, 1); g.fillCircle(20, 20, 4);
  });
  draw('rock', 120, 90, g => {
    const pts = P([[14, 30], [40, 6], [86, 10], [114, 36], [104, 74], [60, 86], [18, 70]]);
    g.fillStyle(0x2a2238, 1); g.fillPoints(pts, true);
    g.lineStyle(4, 0x8a7aa8, 1); g.strokePoints(pts, true, true);
    g.lineStyle(2, 0x5a4a78, 1); g.lineBetween(40, 30, 70, 50); g.lineBetween(70, 50, 90, 40);
  });
  draw('spark', 8, 8, g => { g.fillStyle(0xffffff, 1); g.fillCircle(4, 4, 3); });
}

class Preview extends Phaser.Scene {
  constructor() { super('p'); }
  create() {
    makeTextures(this);
    this.add.text(W / 2, 36, 'กิมมิคสิ่งกีดขวาง (พรีวิว)', { fontFamily: FONT, fontSize: 36, fontStyle: '700', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 76, 'สีแดง = อันตราย ยิงไม่แตก · ยานฟ้า = เรา (บอทขับหลบให้ดู)', { fontFamily: FONT, fontSize: 17, color: '#a9b9d6' }).setOrigin(0.5);
    GIMMICKS.forEach((gm, i) => {
      const col = i % 4, row = Math.floor(i / 4);
      const x0 = 14 + col * (PW + GAP), y0 = TOP + row * (PH + ROWGAP);
      this.panel(gm, i, x0, y0);
    });
    // ช่องที่ 8: สรุปข้อแนะนำ
    const x0 = 14 + 3 * (PW + GAP), y0 = TOP + PH + ROWGAP;
    const g = this.add.graphics(); g.lineStyle(2, 0x5b2fbf, 0.8).strokeRoundedRect(x0, y0, PW, PH, 14);
    this.add.text(x0 + 16, y0 + 18, 'ผมแนะนำเริ่ม\n1 + 2 + 4\n\n• 1 = ด่านพิเศษ CORRIDOR\n  (ตามที่วาดมา)\n• 2, 4 = สุ่มแทรกระหว่าง wave\n  รอบสูงยิ่งถี่\n\n• เกราะยังกันได้\n• อมตะทะลุได้\n• มีเส้นเตือนก่อนเสมอ', { fontFamily: FONT, fontSize: 16, color: '#e8f3ff', lineSpacing: 6 });
  }

  panel(gm, i, x0, y0) {
    const bg = this.add.graphics();
    bg.fillStyle(0x07041a, 1).fillRect(x0, y0, PW, PH);
    for (let x = x0; x < x0 + PW; x += 24) { bg.lineStyle(1, 0x5b2fbf, 0.3); bg.lineBetween(x, y0, x, y0 + PH); }
    for (let y = y0; y < y0 + PH; y += 24) { bg.lineStyle(1, 0x5b2fbf, 0.3); bg.lineBetween(x0, y, x0 + PW, y); }
    this.add.text(x0 + PW / 2, y0 - 28, gm.name, { fontFamily: FONT, fontSize: 16, fontStyle: '700', color: '#ffffff' }).setOrigin(0.5, 1);
    this.add.text(x0 + PW / 2, y0 - 8, gm.note, { fontFamily: FONT, fontSize: 12, color: '#a9b9d6' }).setOrigin(0.5, 1);
    const mask = this.make.graphics({ add: false }); mask.fillRect(x0, y0, PW, PH);
    const box = this.add.container(0, 0).setMask(mask.createGeometryMask());
    const P = { x0, y0, box, cx: x0 + PW / 2 };
    P.ship = this.add.image(P.cx, y0 + PH - 50, 'ship').setScale(0.6).setDepth(5); box.add(P.ship);
    P.tx = P.cx;   // เป้าที่บอทจะขับไป
    // ยิงปืนตลอด (กระสุนชนสิ่งกีดขวางแล้วหาย)
    P.shots = [];
    this.time.addEvent({ delay: 130, loop: true, callback: () => {
      const b = this.add.image(P.ship.x, P.ship.y - 22, 'bullet').setScale(0.8); box.add(b); P.shots.push(b);
    } });
    const fx = [this.corridor, this.gates, this.curtain, this.zones, this.mines, this.blackhole, this.rocks][i];
    fx.call(this, P);
    this.events.on('update', (t, dt) => {
      P.ship.x += (Phaser.Math.Clamp(P.tx, x0 + 16, x0 + PW - 16) - P.ship.x) * Math.min(1, dt / 120);
      for (const b of P.shots) { b.y -= dt * 0.9; if (b.y < y0 - 20 || (P.blocks && P.blocks(b))) { b.destroy(); b.dead = true; } }
      P.shots = P.shots.filter(b => !b.dead);
    });
  }

  // 1. ทางเดิน: กลางทางเปลี่ยนเป็นขั้นบันได (ตรง → เลี้ยว → ตรง) แบบภาพที่วาด
  corridor(P) {
    const g = this.add.graphics(); P.box.add(g);
    const half = 46, seg = 150;
    const targets = []; for (let k = 0; k < 400; k++) targets.push(P.x0 + 60 + ((k * 97) % (PW - 120)));
    const centerAt = wy => {   // wy = ระยะทางโลก (เพิ่มขึ้นตามเวลา)
      const k = Math.floor(wy / seg), f = (wy % seg) / seg;
      const a = targets[k % targets.length], b = targets[(k + 1) % targets.length];
      const s = f < 0.6 ? 0 : (f - 0.6) / 0.4;   // 60% ตรง 40% เลี้ยว
      return a + (b - a) * (s * s * (3 - 2 * s));
    };
    let dist = 0;
    this.events.on('update', (t, dt) => {
      dist += dt * 0.09;
      g.clear();
      const pts = [];
      for (let y = P.y0 + PH; y >= P.y0 - 10; y -= 6) pts.push([y, centerAt(dist + (P.y0 + PH - y))]);
      g.fillStyle(RED, 0.16);
      for (const [y, c] of pts) { g.fillRect(P.x0, y - 3, c - half - P.x0, 6); g.fillRect(c + half, y - 3, P.x0 + PW - c - half, 6); }
      for (const side of [-1, 1]) {
        g.lineStyle(8, RED, 0.25); g.beginPath(); pts.forEach(([y, c], k) => (k ? g.lineTo(c + side * half, y) : g.moveTo(c + side * half, y))); g.strokePath();
        g.lineStyle(3, RED2, 1); g.beginPath(); pts.forEach(([y, c], k) => (k ? g.lineTo(c + side * half, y) : g.moveTo(c + side * half, y))); g.strokePath();
      }
      P.tx = centerAt(dist + (P.y0 + PH - (P.ship.y - 40)));
    });
    P.blocks = b => { const c = centerAt(dist + (P.y0 + PH - b.y)); return Math.abs(b.x - c) > half; };
  }

  // 2. ประตูเลเซอร์: เส้นเตือนกะพริบ แล้วรั้วเลื่อนลงมา
  gates(P) {
    const g = this.add.graphics(); P.box.add(g);
    const gates = [];
    const spawn = () => {
      const gap = P.x0 + 40 + Math.random() * (PW - 80), y = P.y0 + 14;
      gates.push({ y, gap, warn: 700, w: 62 });
    };
    spawn(); this.time.addEvent({ delay: 1500, loop: true, callback: spawn });
    this.events.on('update', (t, dt) => {
      g.clear();
      for (const o of gates) {
        if (o.warn > 0) { o.warn -= dt; if (Math.floor(o.warn / 120) % 2) { g.lineStyle(2, RED, 0.8); g.lineBetween(P.x0, o.y, P.x0 + PW, o.y); } continue; }
        o.y += dt * 0.16;
        for (const [a, b] of [[P.x0, o.gap - o.w / 2], [o.gap + o.w / 2, P.x0 + PW]]) {
          g.fillStyle(RED, 0.25).fillRect(a, o.y - 7, b - a, 14);
          g.fillStyle(RED2, 1).fillRect(a, o.y - 2, b - a, 4);
        }
        g.fillStyle(0xffffff, 1).fillCircle(o.gap - o.w / 2, o.y, 4).fillCircle(o.gap + o.w / 2, o.y, 4);
      }
      while (gates.length && gates[0].y > P.y0 + PH + 20) gates.shift();
      const next = gates.filter(o => o.y < P.ship.y + 10).sort((a, b) => b.y - a.y)[0];
      if (next) P.tx = next.gap;
    });
    P.blocks = b => gates.some(o => o.warn <= 0 && Math.abs(b.y - o.y) < 8 && Math.abs(b.x - o.gap) > o.w / 2);
  }

  // 3. ม่านกระสุน: แถวกระสุนเต็มจอ เว้นช่อง
  curtain(P) {
    const rows = [];
    this.time.addEvent({ delay: 1100, loop: true, callback: () => {
      const gap = P.x0 + 40 + Math.random() * (PW - 80);
      const row = { gap, y: P.y0 - 10 }; rows.push(row);
      this.tweens.add({ targets: row, y: P.y0 + PH + 30, duration: 2800 });
      for (let x = P.x0 + 10; x < P.x0 + PW; x += 22) {
        if (Math.abs(x - gap) < 34) continue;
        const o = this.add.image(x, P.y0 - 10, 'ebullet').setScale(0.75); P.box.add(o);
        this.tweens.add({ targets: o, y: P.y0 + PH + 30, duration: 2800, onComplete: () => o.destroy() });
      }
    } });
    this.events.on('update', () => {
      const next = rows.filter(r => r.y < P.ship.y + 10).sort((a, b) => b.y - a.y)[0];
      if (next) P.tx = next.gap;
    });
  }

  // 4. เขตเตือนภัย: แถบแดงกะพริบ 1 วิ แล้วลำแสงถล่ม
  zones(P) {
    const g = this.add.graphics().setBlendMode('ADD'); P.box.add(g);
    const cols = 5, cw = PW / cols;
    let warnAt = 0, fireAt = 0, picks = [];
    const cycle = () => {
      picks = Phaser.Utils.Array.Shuffle([0, 1, 2, 3, 4]).slice(0, 3);
      const safe = [0, 1, 2, 3, 4].filter(c => !picks.includes(c));
      P.tx = P.x0 + (Phaser.Utils.Array.GetRandom(safe) + 0.5) * cw;
      warnAt = this.time.now; fireAt = warnAt + 1000;
    };
    cycle(); this.time.addEvent({ delay: 1600, loop: true, callback: cycle });
    this.events.on('update', (t) => {
      g.clear();
      for (const c of picks) {
        const x = P.x0 + c * cw;
        if (t < fireAt) {   // เตือน: แถบแดงกะพริบแรงขึ้นเรื่อยๆ ก่อนถล่ม
          const blink = 0.5 + 0.5 * Math.sin((t - warnAt) / 50 * (1 + (t - warnAt) / 600));
          g.fillStyle(RED, 0.08 + blink * 0.16).fillRect(x + 2, P.y0, cw - 4, PH);
          g.lineStyle(2, RED, 0.5 + blink * 0.5).strokeRect(x + 2, P.y0, cw - 4, PH);
        }
        else if (t < fireAt + 500) {
          const k = 1 - (t - fireAt) / 500;
          g.fillStyle(RED, 0.35 * k + 0.1).fillRect(x, P.y0, cw, PH);
          g.fillStyle(0xffffff, 0.8 * k).fillRect(x + cw / 2 - 4, P.y0, 8, PH);
        }
      }
    });
  }

  // 5. ทุ่นระเบิด: ลอยลงมา ยิงแล้วกระเด็นถอย ไม่แตก
  mines(P) {
    const mines = [];
    this.time.addEvent({ delay: 900, loop: true, callback: () => {
      const m = this.add.image(P.x0 + 20 + Math.random() * (PW - 40), P.y0 - 20, 'mine').setScale(0.8); P.box.add(m);
      m.vy = 0.06; mines.push(m);
    } });
    this.events.on('update', (t, dt) => {
      let danger = null;
      for (const m of mines) {
        m.vy = Math.min(0.07, m.vy + dt * 0.00012); m.y += m.vy * dt; m.rotation += dt * 0.002;
        m.setTint(Math.floor(t / 200) % 2 ? 0xffffff : 0xffb3bd);
        if (m.y > P.ship.y - 160 && m.y < P.ship.y + 10 && Math.abs(m.x - P.ship.x) < 50) danger = m;
      }
      for (let k = mines.length - 1; k >= 0; k--) if (mines[k].y > P.y0 + PH + 30) { mines[k].destroy(); mines.splice(k, 1); }
      P.tx = danger ? (danger.x > P.cx ? danger.x - 80 : danger.x + 80) : P.tx;
    });
    P.blocks = b => { const m = mines.find(m => Math.abs(m.x - b.x) < 16 && Math.abs(m.y - b.y) < 16); if (m) { m.vy = -0.12; return true; } return false; };
  }

  // 6. หลุมดำ: ดูดยาน ยานต้องขับฝืน
  blackhole(P) {
    const g = this.add.graphics(); P.box.add(g);
    const hx = P.x0 + 30, hy = P.y0 + PH * 0.55;
    const parts = this.add.particles(0, 0, 'spark', { x: { min: P.x0, max: P.x0 + PW }, y: { min: P.y0, max: P.y0 + PH }, lifespan: 900, scale: { start: 0.7, end: 0 }, tint: [RED, 0xb46bff], blendMode: 'ADD', frequency: 30,
      moveToX: hx, moveToY: hy });
    P.box.add(parts);
    this.events.on('update', (t, dt) => {
      g.clear();
      for (let k = 0; k < 4; k++) { g.lineStyle(3, k % 2 ? RED : 0xb46bff, 0.6); g.beginPath(); for (let a = 0; a < Math.PI * 2; a += 0.2) { const r = 18 + k * 12 + Math.sin(a * 3 + t / 200) * 3; const x = hx + Math.cos(a + t / (300 + k * 80)) * r, y = hy + Math.sin(a + t / (300 + k * 80)) * r; a ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); g.strokePath(); }
      g.fillStyle(0x000000, 1).fillCircle(hx, hy, 14); g.lineStyle(2, 0xffffff, 0.8).strokeCircle(hx, hy, 14);
      // แรงดูดดึงยานไปทางหลุม บอทพยายามฝืนกลับ (ยานจะสั่นๆ ไม่ถึงเป้า)
      P.ship.x -= dt * 0.11;
      P.tx = P.x0 + PW - 50 + Math.sin(t / 700) * 20;
    });
  }

  // 7. แผ่นหิน: ลอยผ่าน บังกระสุนเรา ศัตรูหลบอยู่ด้านหลัง
  rocks(P) {
    const rocks = [];
    const enemy = this.add.image(P.cx, P.y0 + 60, 'enemy').setScale(0.8); P.box.add(enemy);
    this.tweens.add({ targets: enemy, x: { from: P.x0 + 40, to: P.x0 + PW - 40 }, duration: 2600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.time.addEvent({ delay: 1700, loop: true, callback: () => {
      const r = this.add.image(P.x0 + 30 + Math.random() * (PW - 60), P.y0 - 50, 'rock').setScale(0.7); P.box.add(r); rocks.push(r);
      this.tweens.add({ targets: r, y: P.y0 + PH + 60, duration: 5200, onComplete: () => { r.destroy(); r.dead = true; } });
    } });
    this.events.on('update', () => {
      // บอทหาช่องที่ยิงถึงศัตรูได้ (ไม่มีหินบัง)
      const blocked = x => rocks.some(r => !r.dead && r.y < P.ship.y - 30 && r.y > enemy.y && Math.abs(r.x - x) < 42);
      if (!blocked(enemy.x)) P.tx = enemy.x; else P.tx = enemy.x + (enemy.x > P.cx ? -90 : 90);
    });
    P.blocks = b => {
      const hitRock = rocks.find(r => !r.dead && Math.abs(r.x - b.x) < 40 && Math.abs(r.y - b.y) < 28);
      if (hitRock) { const s = this.add.image(b.x, b.y, 'spark').setTint(0x8a7aa8); P.box.add(s); this.tweens.add({ targets: s, scale: 2, alpha: 0, duration: 200, onComplete: () => s.destroy() }); }
      return !!hitRock;
    };
  }
}
window.game = new Phaser.Game({ type: Phaser.AUTO, parent: 'wrap', width: W, height: TOP + 2 * PH + ROWGAP + 30, backgroundColor: '#05030f', scene: Preview });
</script>
</body>
</html>

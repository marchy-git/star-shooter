<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode Backgrounds</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #05030f; --panel: #0d0b22; --line: #2a2a55; --text: #e8f3ff; --dim: #8b93b8; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Chakra Petch", system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 28px; margin: 6px 0 4px; }
  h1 small { font-size: 14px; color: var(--dim); font-weight: 500; margin-left: 8px; }
  .lead { color: var(--dim); margin: 0 0 14px; line-height: 1.6; }
  .ctrl { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .ctrl button { font: 500 14px "Chakra Petch", sans-serif; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  .ctrl button.on { background: var(--gold); color: #05030f; border-color: var(--gold); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid color-mix(in srgb, var(--ep) 50%, transparent); border-radius: 20px; overflow: hidden; }
  .card canvas { display: block; width: 100%; aspect-ratio: 9 / 16; cursor: zoom-in; }
  .body { padding: 12px 14px 16px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #05030f; background: var(--ep); border-radius: 6px; padding: 1px 7px; }
  .tag.cur { background: #8b93b8; }
  .name { font-size: 19px; font-weight: 700; margin: 6px 0 6px; }
  ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; line-height: 1.6; }
  ul li b { color: var(--text); font-weight: 500; }
  .zoom { position: fixed; inset: 0; background: rgba(3,2,10,.92); display: none; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  .zoom.on { display: flex; }
  .zoom canvas { height: 92vh; max-width: 96vw; aspect-ratio: 9 / 16; border-radius: 18px; box-shadow: 0 0 60px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div class="wrap">
  <h1>ฉากหลังของ 5 EP <small>หน้าพรีวิวดีไซน์ (ยังไม่ได้ใส่เกม)</small></h1>
  <p class="lead">ฉากเลื่อนจริงเหมือนตอนเล่น (ขนาดจอเกม 9:16) · มียานเรา ศัตรู กระสุนฟ้าของเรา และ <b style="color:#ff3b3b">กระสุนแดงของศัตรู</b> วางทับไว้ให้ดูว่ามองออกไหม ·
    <b>แตะที่ฉากเพื่อขยาย</b> · การ์ดแรกคือฉากปัจจุบันในเกมไว้เทียบ</p>
  <div class="ctrl">
    <button id="tgGame" class="on">แสดงยาน/ศัตรู/กระสุน</button>
    <button id="tgHud" class="on">แสดง HUD</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="zoom" id="zoom"><canvas id="zoomCv" width="720" height="1280"></canvas></div>

<script>
// หน้าพรีวิวฉากหลังแต่ละ EP — เปิดไฟล์นี้ตรงๆ ในเบราว์เซอร์ได้เลย (ไม่ได้ deploy) · วาดด้วย canvas ทั้งหมด
// พิกัดวาดทั้งหมดอยู่ในกรอบ 360×640 (= จอเกม 480 กว้าง ย่อ 0.75)
const W = 360, H = 640, TAU = Math.PI * 2;
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };
const lg = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(s => g.addColorStop(s[0], s[1])); return g; };
const rg = (c, x, y, r0, r1, st) => { const g = c.createRadialGradient(x, y, r0, x, y, r1); st.forEach(s => g.addColorStop(s[0], s[1])); return g; };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const wrap = (v, m) => ((v % m) + m) % m;
function mkStars(seed, n) { const r = rng(seed); return Array.from({ length: n }, () => ({ x: r() * W, y: r() * H, s: r() < 0.12 ? 1.8 : 1, a: 0.25 + r() * 0.65, p: r() * TAU })); }
function drawStars(c, st, t, sp, col = '#ffffff') {
  for (const s of st) { c.fillStyle = rgba(col, s.a * (0.75 + 0.25 * Math.sin(t * 2 + s.p))); c.fillRect(s.x, wrap(s.y + t * sp, H), s.s, s.s); }
}
function rockPts(r, n, rad) { return Array.from({ length: n }, (_, i) => { const a = i / n * TAU, k = rad * (0.7 + r() * 0.45); return [Math.cos(a) * k, Math.sin(a) * k]; }); }
function poly(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
function vignette(c, a = 0.55) { c.fillStyle = rg(c, W / 2, H * 0.55, H * 0.25, H * 0.75, [[0, 'rgba(0,0,0,0)'], [1, `rgba(0,0,0,${a})`]]); c.fillRect(0, 0, W, H); }
function bolt(c, r, x0, y0, x1, y1, seg = 7, j = 16) {
  c.beginPath(); c.moveTo(x0, y0);
  for (let i = 1; i < seg; i++) { const f = i / seg; c.lineTo(x0 + (x1 - x0) * f + (r() - 0.5) * j, y0 + (y1 - y0) * f + (r() - 0.5) * j); }
  c.lineTo(x1, y1); c.stroke();
}
// value noise สำหรับทำลายเมฆ/ผิวดวงอาทิตย์
const hsh = (x, y) => { let v = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi, s = q => q * q * (3 - 2 * q);
  const a = hsh(xi, yi), b = hsh(xi + 1, yi), c = hsh(xi, yi + 1), d = hsh(xi + 1, yi + 1), U = s(u), V = s(v); return a + (b - a) * U + (c - a) * V + (a - b - c + d) * U * V; };

// ---------------------------------------------------------------- ฉากแต่ละด่าน
const SCENES = [
  // ฉากปัจจุบันในเกม (เนบิวลานีออน) ไว้เทียบ
  { tag: 'ตอนนี้', cur: true, name: 'ฉากปัจจุบัน · เนบิวลานีออน', color: '#8b93b8',
    notes: ['ดาวเลื่อน + ตารางเส้นนีออน + แสงฟุ้งบน/ล่าง', 'เปลี่ยนสีทุกรอบ (5 ธีม)'],
    init() { return { st: mkStars(1, 170) }; },
    draw(c, t, S) {
      c.fillStyle = '#07041a'; c.fillRect(0, 0, W, H); drawStars(c, S.st, t, 22, '#c9b8ff');
      c.strokeStyle = 'rgba(91,47,191,.3)'; c.lineWidth = 1; const o = wrap(t * 60, 30);
      c.beginPath(); for (let x = 0; x <= W; x += 30) { c.moveTo(x + 0.5, 0); c.lineTo(x + 0.5, H); } for (let y = -30; y <= H; y += 30) { c.moveTo(0, y + o); c.lineTo(W, y + o); } c.stroke();
      c.fillStyle = lg(c, 0, 0, 0, 200, [[0, 'rgba(255,61,242,.3)'], [1, 'rgba(255,61,242,0)']]); c.fillRect(0, 0, W, 200);
      c.fillStyle = lg(c, 0, H, 0, H - 200, [[0, 'rgba(54,241,255,.22)'], [1, 'rgba(54,241,255,0)']]); c.fillRect(0, H - 200, W, 200);
    } },

  // EP1 วงแหวนดาวเสาร์ — ดาวเสาร์ยักษ์ข้างจอ วงแหวนพาดเฉียง เศษน้ำแข็ง/หินทองลอยตามแนววงแหวน
  { tag: 'EP1', name: 'วงแหวนดาวเสาร์', color: '#ffd23f',
    notes: ['<b>ดาวเสาร์ยักษ์</b> ครึ่งดวงโผล่ขวาจอ เลื่อนลงช้ามาก', '<b>แถบเศษวงแหวน</b> หินน้ำแข็ง/ทองไหลเฉียงตามแนววงแหวน', '<b>ก้อนหินใหญ่</b> ลอยข้างจอ (ฉากหลัง ชนไม่ได้)', 'ไอเดียสิ่งกีดขวาง: ฝนเศษวงแหวนพาดเฉียง'],
    init() {
      const r = rng(11);
      return { st: mkStars(2, 130),
        rocks: Array.from({ length: 90 }, () => ({ u: r() * 760, v: (r() - 0.5) * 70, s: 1 + r() * 3.2, sp: 10 + r() * 22, ice: r() < 0.55, pts: rockPts(r, 6, 1) })),
        chunks: Array.from({ length: 5 }, (_, i) => ({ x: i % 2 ? W - 20 - r() * 40 : 20 + r() * 40, y: r() * 900, s: 20 + r() * 26, rot: (r() - 0.5) * 0.4, pts: rockPts(r, 9, 1) })),
        dust: mkStars(3, 60) };
    },
    draw(c, t, S) {
      c.fillStyle = lg(c, 0, 0, 0, H, [[0, '#0b0820'], [0.6, '#120c18'], [1, '#1c1306']]); c.fillRect(0, 0, W, H);
      drawStars(c, S.st, t, 6);
      const px = W * 0.86, py = wrap(t * 4 + 420, H + 600) - 300, R = 150;
      const ring = back => {
        c.save(); c.translate(px, py); c.rotate(-0.38); const a0 = back ? Math.PI : 0, a1 = back ? TAU : Math.PI;
        [[2.45, 10, '#6a5226', 0.8], [2.22, 18, '#c9a24a', 0.55], [1.95, 12, '#f2e2b8', 0.5], [1.7, 7, '#8a6a30', 0.6], [2.6, 3, '#ffe08a', 0.5]].forEach(([k, lw, col, a]) => {
          c.beginPath(); c.ellipse(0, 0, R * k, R * k * 0.24, 0, a0, a1); c.lineWidth = lw; c.strokeStyle = rgba(col, a); c.stroke(); });
        c.restore();
      };
      ring(true);
      c.save(); c.beginPath(); c.arc(px, py, R, 0, TAU); c.clip();
      const bands = ['#a8905c', '#8a6e3e', '#c2aa76', '#7a5e32', '#b09460'];
      for (let i = 0; i < 16; i++) { c.fillStyle = bands[i % 5]; c.fillRect(px - R, py - R + i * R / 8, 2 * R, R / 8 + 1); }
      c.fillStyle = rg(c, px - R * 0.5, py - R * 0.4, R * 0.1, R * 1.4, [[0, 'rgba(0,0,0,0)'], [0.55, 'rgba(0,0,0,.35)'], [1, 'rgba(0,0,0,.9)']]); c.fillRect(px - R, py - R, 2 * R, 2 * R);
      c.restore();
      ring(false);
      // แถบเศษวงแหวนพาดเฉียง
      const ang = -0.38, by = wrap(t * 14 + 260, H + 300) - 150, ca = Math.cos(ang), sa = Math.sin(ang);
      c.fillStyle = 'rgba(255,220,140,.05)'; c.save(); c.translate(W / 2, by); c.rotate(ang); c.fillRect(-400, -40, 800, 80); c.restore();
      for (const k of S.rocks) {
        const u = wrap(k.u + t * k.sp, 760) - 380, x = W / 2 + ca * u - sa * k.v, y = by + sa * u + ca * k.v;
        c.save(); c.translate(x, y); c.rotate(t * 0.5 + k.u); c.scale(k.s, k.s); poly(c, k.pts);
        c.fillStyle = k.ice ? 'rgba(200,236,255,.55)' : 'rgba(230,190,110,.6)'; c.fill(); c.restore();
      }
      for (const k of S.chunks) {
        const y = wrap(k.y + t * 26, H + 200) - 100;
        c.save(); c.translate(k.x, y); c.rotate(t * k.rot + k.y); c.scale(k.s, k.s); poly(c, k.pts);
        c.fillStyle = lg(c, -1, -1, 1, 1, [[0, '#5a4628'], [1, '#140e06']]); c.fill(); c.strokeStyle = 'rgba(255,210,120,.35)'; c.lineWidth = 0.06; c.stroke(); c.restore();
      }
      c.save(); c.globalCompositeOperation = 'lighter';
      for (const d of S.dust) { const tw = Math.max(0, Math.sin(t * 3 + d.p * 5)); c.fillStyle = `rgba(255,220,130,${0.6 * tw})`; c.fillRect(d.x, wrap(d.y + t * 30, H), 1.5, 1.5); }
      c.restore();
      vignette(c, 0.45);
    } },

  // EP2 พายุยักษ์พฤหัส — บินเหนือยอดเมฆลายแถบ วังวนพายุยักษ์ ฟ้าแลบในเมฆ ลมกรด
  { tag: 'EP2', name: 'พายุยักษ์พฤหัส', color: '#ff9a3c',
    notes: ['<b>ยอดเมฆลายแถบ</b> ไหลเป็นคลื่นเต็มจอ (หรี่ไว้ให้เห็นกระสุน)', '<b>วังวนพายุยักษ์</b> หมุนผ่านทุก ~30 วิ', '<b>ฟ้าแลบในเมฆ</b> แวบสีม่วงเป็นระยะ', '<b>ลมกรด</b> เส้นลมพัดเฉียงเร็วๆ', 'ไอเดียสิ่งกีดขวาง: ลมพัดยานไปข้างๆ'],
    init() {
      const TH = 1024, cv = document.createElement('canvas'); cv.width = W; cv.height = TH;
      const c = cv.getContext('2d'), img = c.createImageData(W, TH), d = img.data;
      const pal = ['#9a5a2c', '#d9a87a', '#6a3418', '#ecd0a0', '#b0663a', '#4a2412', '#c88a52', '#e2bc8a'].map(hex2rgb);
      for (let y = 0; y < TH; y++) for (let x = 0; x < W; x++) {
        // ลายแถบบางๆ ไหลเป็นคลื่น + ความปั่นป่วนยืดตามแนวนอน (ต่อขอบบน-ล่างได้สนิท)
        const q = y / TH * TAU, ty = y / TH, turb = vn(x / 70, y / 7) * (1 - ty) + vn(x / 70, (y - TH) / 7) * ty;
        const v = y / TH * 40 + 0.9 * Math.sin(x * 0.011 + q * 5) + 0.45 * Math.sin(x * 0.029 + q * 11 + 1) + 1.1 * (turb - 0.5);
        const i = Math.floor(v), f = v - i, sm = f < 0.55 ? 0 : (f - 0.55) / 0.45, e = sm * sm * (3 - 2 * sm);
        const fine = vn(x / 40, y / 1.5) * (1 - ty) + vn(x / 40, (y - TH) / 1.5) * ty;
        const a = pal[wrap(i, 8)], b = pal[wrap(i + 1, 8)], n = 0.82 + 0.3 * fine, k = (y * W + x) * 4;
        for (let ch = 0; ch < 3; ch++) d[k + ch] = (a[ch] + (b[ch] - a[ch]) * e) * n * 0.48;
        d[k + 3] = 255;
      }
      c.putImageData(img, 0, 0);
      const r = rng(21);
      return { tex: cv, TH, wind: Array.from({ length: 26 }, () => ({ x: r() * 500, y: r() * H, l: 30 + r() * 50, sp: 220 + r() * 160, a: 0.08 + r() * 0.18 })) };
    },
    draw(c, t, S) {
      const off = wrap(t * 22, S.TH);
      c.drawImage(S.tex, 0, off - S.TH); c.drawImage(S.tex, 0, off);
      // วังวนพายุ
      const cy = wrap(t * 22 + 380, 1400) - 300, cx = W * 0.32;
      c.save(); c.translate(cx, cy); c.scale(1, 0.55);
      c.fillStyle = rg(c, 0, 0, 0, 130, [[0, 'rgba(60,20,8,.9)'], [0.4, 'rgba(150,70,30,.6)'], [1, 'rgba(150,70,30,0)']]); c.beginPath(); c.arc(0, 0, 130, 0, TAU); c.fill();
      c.lineWidth = 5;
      for (let k = 0; k < 7; k++) { const rr = 20 + k * 16; c.strokeStyle = `rgba(240,200,140,${0.35 - k * 0.04})`; c.beginPath(); c.arc(0, 0, rr, -t * (1.2 - k * 0.12) + k, -t * (1.2 - k * 0.12) + k + 2.4); c.stroke(); }
      c.restore();
      // ฟ้าแลบในเมฆ
      const P = 1.6, cyc = Math.floor(t / P), tt = t - cyc * P;
      if (tt < 0.3) {
        const r = rng(cyc * 7 + 3), x = 40 + r() * (W - 80), y = 60 + r() * (H - 200), a = 1 - tt / 0.3;
        c.save(); c.globalCompositeOperation = 'lighter';
        c.fillStyle = rg(c, x, y, 0, 110, [[0, `rgba(210,180,255,${0.45 * a})`], [1, 'rgba(140,90,255,0)']]); c.fillRect(x - 110, y - 110, 220, 220);
        c.strokeStyle = `rgba(240,230,255,${0.9 * a})`; c.lineWidth = 1.6; c.shadowColor = '#c18bff'; c.shadowBlur = 10;
        const rb = rng(cyc * 13 + 1); bolt(c, rb, x - 50 + rb() * 100, y - 60, x, y + 50, 8, 22);
        c.restore();
      }
      // ลมกรด
      c.lineWidth = 1.2;
      for (const w of S.wind) { const x = wrap(w.x + t * w.sp, W + 140) - 70, y = wrap(w.y + t * 40, H); c.strokeStyle = `rgba(255,236,200,${w.a})`; c.beginPath(); c.moveTo(x, y); c.lineTo(x + w.l, y + w.l * 0.12); c.stroke(); }
      vignette(c, 0.6);
    } },

  // EP3 ทะเลคริสตัลเนปจูน — ใต้ชั้นบรรยากาศเหมือนน้ำลึก ลำแสงส่องลงมา ผาคริสตัลสองข้าง ฟองผลึกลอยขึ้น
  { tag: 'EP3', name: 'ทะเลคริสตัลเนปจูน', color: '#36a8ff',
    notes: ['<b>บรรยากาศน้ำลึก</b> ฟ้าเข้มไล่เป็นดำ', '<b>ลำแสงส่องลงมา</b> แกว่งช้าๆ', '<b>ผาคริสตัล</b> สองข้างจอ เรืองแสงฟ้า', '<b>ฟองผลึก</b> ลอยขึ้นสวนทาง', 'ไอเดียสิ่งกีดขวาง: แท่งคริสตัลงอกจากข้างจอ'],
    init() {
      const r = rng(31);
      const clusters = Array.from({ length: 8 }, (_, i) => ({ side: i % 2, y: i * 130 + r() * 60,
        shards: Array.from({ length: 3 + Math.floor(r() * 3) }, () => ({ len: 28 + r() * 52, w: 8 + r() * 10, ang: 0.35 + r() * 0.9, off: (r() - 0.5) * 50 })) }));
      return { st: mkStars(4, 60), clusters,
        motes: Array.from({ length: 55 }, () => ({ x: r() * W, y: r() * H, s: 1 + r() * 3, sp: 14 + r() * 30, p: r() * TAU, bub: r() < 0.5 })),
        ice: Array.from({ length: 14 }, () => ({ x: r() * W, y: r() * H, s: 3 + r() * 5, rot: r() * 3 })) };
    },
    draw(c, t, S) {
      c.fillStyle = lg(c, 0, 0, 0, H, [[0, '#0b3f78'], [0.35, '#05214a'], [1, '#000814']]); c.fillRect(0, 0, W, H);
      drawStars(c, S.st, t, 4, '#9ff3ff');
      c.fillStyle = rg(c, W * 0.5, -120, 40, 380, [[0, 'rgba(90,170,255,.45)'], [1, 'rgba(90,170,255,0)']]); c.fillRect(0, 0, W, H);
      c.save(); c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 6; i++) {
        const x = 30 + i * 62 + Math.sin(t * 0.35 + i * 1.7) * 26, w = 18 + (i % 3) * 12, sk = 90 + Math.sin(t * 0.25 + i) * 40;
        c.fillStyle = lg(c, 0, 0, 0, H * 0.8, [[0, 'rgba(160,230,255,.13)'], [1, 'rgba(160,230,255,0)']]);
        c.beginPath(); c.moveTo(x - w, 0); c.lineTo(x + w, 0); c.lineTo(x + w * 2.4 + sk, H * 0.8); c.lineTo(x - w * 0.4 + sk, H * 0.8); c.closePath(); c.fill();
      }
      c.restore();
      for (const k of S.ice) { const y = wrap(k.y + t * 18, H + 20) - 10; c.save(); c.translate(k.x, y); c.rotate(k.rot + t * 0.3); c.fillStyle = 'rgba(160,230,255,.25)'; poly(c, [[0, -k.s * 1.6], [k.s * 0.6, 0], [0, k.s * 1.6], [-k.s * 0.6, 0]]); c.fill(); c.restore(); }
      // ผาคริสตัลสองข้าง
      for (const cl of S.clusters) {
        const y = wrap(cl.y + t * 30, H + 420) - 210, dir = cl.side ? -1 : 1, x0 = cl.side ? W : 0;
        for (const s of cl.shards) {
          c.save(); c.translate(x0, y + s.off); c.scale(dir, 1); c.rotate(-s.ang);
          poly(c, [[0, -s.w / 2], [s.len, -s.w / 2], [s.len + s.w * 0.9, 0], [s.len, s.w / 2], [0, s.w / 2]]);
          c.fillStyle = lg(c, 0, 0, s.len, 0, [[0, 'rgba(8,40,80,.9)'], [0.7, 'rgba(30,110,170,.6)'], [1, 'rgba(170,235,255,.7)']]); c.fill();
          c.shadowColor = '#36f1ff'; c.shadowBlur = 6; c.strokeStyle = 'rgba(150,240,255,.45)'; c.lineWidth = 1.2; c.stroke();
          c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(4, 0); c.lineTo(s.len + s.w * 0.6, 0); c.stroke();
          c.restore();
        }
      }
      for (const m of S.motes) {
        const y = H - wrap(m.y + t * m.sp, H + 20), x = m.x + Math.sin(t * 1.2 + m.p) * 6;
        if (m.bub) { c.strokeStyle = 'rgba(170,240,255,.5)'; c.lineWidth = 1; c.beginPath(); c.arc(x, y, m.s, 0, TAU); c.stroke(); }
        else { c.fillStyle = 'rgba(120,240,255,.7)'; c.fillRect(x, y, 1.6, 1.6); }
      }
      vignette(c, 0.5);
    } },

  // EP4 ขอบหลุมดำ — หลุมดำยักษ์ด้านบน จานพลังงานหมุน แสงดาวถูกดูดวนเป็นเกลียว
  { tag: 'EP4', name: 'ขอบหลุมดำ', color: '#b46bff',
    notes: ['<b>หลุมดำยักษ์</b> ค้างอยู่ด้านบนจอ จานพลังงานหมุน', '<b>วงแสงโค้ง</b> (แสงหักเหรอบหลุมดำ)', '<b>ดาวถูกดูด</b> หมุนเป็นเกลียวเข้าหาศูนย์กลาง', '<b>หมอกเนบิวลาม่วง</b> ลอยช้าๆ', 'ไอเดียสิ่งกีดขวาง: แรงดูดดึงยานขึ้นด้านบน', 'ธีม "ขอบหลุมดำ" ในรอบปกติตอนนี้ จะเปลี่ยนชื่อ/สีไม่ให้ซ้ำ'],
    init() {
      const r = rng(41);
      return { st: mkStars(5, 150),
        sp: Array.from({ length: 110 }, () => ({ ph: r(), a0: r() * TAU, sp: 0.05 + r() * 0.08, w: 0.6 + r() * 1.4 })),
        fog: Array.from({ length: 6 }, () => ({ x: r() * W, y: r() * H, r: 120 + r() * 140, p: r() * TAU })) };
    },
    draw(c, t, S) {
      c.fillStyle = '#030108'; c.fillRect(0, 0, W, H);
      c.save(); c.globalCompositeOperation = 'lighter';
      for (const f of S.fog) { const y = wrap(f.y + t * 8, H + 300) - 150, x = f.x + Math.sin(t * 0.2 + f.p) * 30; c.fillStyle = rg(c, x, y, 0, f.r, [[0, 'rgba(110,50,200,.16)'], [1, 'rgba(110,50,200,0)']]); c.fillRect(x - f.r, y - f.r, f.r * 2, f.r * 2); }
      c.restore();
      drawStars(c, S.st, t, 10, '#e2d4ff');
      const cx = W / 2, cy = 150, tilt = 0.12, sq = 0.26;
      const disk = back => {
        c.save(); c.translate(cx, cy); c.rotate(tilt); c.globalCompositeOperation = 'lighter';
        const a0 = back ? Math.PI : 0, a1 = back ? TAU : Math.PI;
        for (let i = 0; i < 22; i++) {
          const rx = 60 + i * 10, f = i / 21;
          c.strokeStyle = rgba(f < 0.25 ? '#ffffff' : f < 0.6 ? '#c18bff' : '#4a6bff', 0.6 * (1 - f) + 0.05); c.lineWidth = 5;
          c.setLineDash([22 + i * 3, 14 + i]); c.lineDashOffset = -t * (140 - i * 4);
          c.beginPath(); c.ellipse(0, 0, rx, rx * sq, 0, a0, a1); c.stroke();
        }
        c.restore();
      };
      disk(true);
      c.save(); c.globalCompositeOperation = 'lighter';
      c.fillStyle = rg(c, cx, cy, 40, 140, [[0, 'rgba(200,160,255,.5)'], [1, 'rgba(120,60,255,0)']]); c.fillRect(cx - 140, cy - 140, 280, 280);
      c.shadowColor = '#fff'; c.shadowBlur = 26; c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, 52, 0, TAU); c.stroke();
      c.strokeStyle = 'rgba(226,200,255,.75)'; c.lineWidth = 9; c.beginPath(); c.ellipse(cx, cy - 8, 74, 44, 0, Math.PI * 1.04, Math.PI * 1.96); c.stroke();
      c.restore();
      c.fillStyle = '#000'; c.beginPath(); c.arc(cx, cy, 48, 0, TAU); c.fill();
      disk(false);
      // ดาวถูกดูดเป็นเกลียว
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      for (const p of S.sp) {
        const life = wrap(p.ph + t * p.sp, 1), rr = 460 * (1 - life) + 56, a = p.a0 + 1400 / rr + t * 0.1;
        const pos = (rr2, aa) => [cx + Math.cos(aa) * rr2, cy + Math.sin(aa) * rr2 * 0.55];
        const [x1, y1] = pos(rr, a), [x0, y0] = pos(rr + 14, a - 22 / rr);
        c.strokeStyle = `rgba(230,210,255,${Math.min(0.9, life * 1.2)})`; c.lineWidth = p.w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      }
      c.restore();
      vignette(c, 0.4);
    } },

  // EP5 ใจกลางดวงอาทิตย์ — ผิวดวงอาทิตย์ยักษ์ด้านบน เปลวพวยพุ่งโค้ง สะเก็ดไฟ แสงวาบ
  { tag: 'EP5', name: 'ใจกลางดวงอาทิตย์', color: '#ffb800',
    notes: ['<b>ผิวดวงอาทิตย์</b> เม็ดแกรนูลเดือดอยู่ด้านบน', '<b>เปลวพวยพุ่ง</b> โค้งเป็นวงจากขอบดวง', '<b>แสงวาบ (solar flare)</b> ทุก ~6 วิ', '<b>สะเก็ดไฟ</b> ปลิวลงตลอด', 'กลางจอหรี่ไว้ + กระสุนแดงศัตรูในด่านนี้ใส่ขอบขาวหนาขึ้น ให้เห็นชัดบนพื้นส้ม', 'ไอเดียสิ่งกีดขวาง: เปลวพวยพุ่งฟาดลงมาเป็นแนว'],
    init() {
      const TW = 720, TH = 220, cv = document.createElement('canvas'); cv.width = TW; cv.height = TH;
      const c = cv.getContext('2d'), img = c.createImageData(TW, TH), d = img.data, cs = 13;
      const pt = (gx, gy) => [gx * cs + hsh(wrap(gx, TW / cs), gy) * cs, gy * cs + hsh(gy + 99, wrap(gx, TW / cs)) * cs];
      for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
        const gx = Math.floor(x / cs), gy = Math.floor(y / cs); let f1 = 1e9, f2 = 1e9;
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const [px, py] = pt(gx + i, gy + j); const dd = Math.hypot(x - px, y - py); if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd; }
        const lane = Math.min(1, (f2 - f1) / 7), b = (0.6 + 0.4 * lane * lane) * (0.75 + 0.45 * vn(x / 40, y / 40)) * (1 - f1 / cs * 0.2), k = (y * TW + x) * 4;
        d[k] = 255 * Math.min(1, b * 1.05); d[k + 1] = 150 * b + 40 * b * b; d[k + 2] = 30 * b; d[k + 3] = 255;
      }
      c.putImageData(img, 0, 0);
      const r = rng(51);
      return { tex: cv, embers: Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, s: 1 + r() * 2.2, sp: 40 + r() * 90, p: r() * TAU, dx: (r() - 0.5) * 20 })),
        proms: [[60, 150, 0], [210, 300, 1.7], [250, 330, 3.1]] };
    },
    draw(c, t, S) {
      c.fillStyle = lg(c, 0, 0, 0, H, [[0, '#3a1400'], [0.35, '#1c0800'], [1, '#080200']]); c.fillRect(0, 0, W, H);
      const R = 1100, sx = W / 2, sy = 170 - R;
      c.fillStyle = rg(c, sx, 170, 0, 330, [[0, 'rgba(255,170,40,.35)'], [1, 'rgba(255,120,0,0)']]); c.fillRect(0, 0, W, H);
      // เปลวพวยพุ่ง (อยู่หลังผิวดวง โค้งลงใต้ขอบ)
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      for (const [x1, x2, ph] of S.proms) {
        const h = 90 + Math.sin(t * 0.7 + ph) * 25, mx = (x1 + x2) / 2;
        for (let k = 0; k < 3; k++) {
          c.strokeStyle = `rgba(255,${120 + k * 40},${30 + k * 30},${(0.2 - k * 0.05) * (0.8 + 0.2 * Math.sin(t * 9 + ph + k))})`; c.lineWidth = 9 - k * 3; c.shadowColor = '#ff8a00'; c.shadowBlur = 14;
          c.beginPath(); c.moveTo(x1, 160); c.bezierCurveTo(x1 - 20 + k * 6, 160 + h * 1.4, x2 + 20 - k * 6, 160 + h * 1.4, x2, 160); c.stroke();
        }
      }
      c.restore();
      // ผิวดวงอาทิตย์
      c.save(); c.beginPath(); c.arc(sx, sy, R, 0, TAU); c.clip();
      const off = wrap(t * 6, S.tex.width); c.globalAlpha = 0.62; c.filter = 'blur(1.2px)';
      c.drawImage(S.tex, -off, -40); c.drawImage(S.tex, S.tex.width - off, -40);
      c.filter = 'none'; c.globalAlpha = 1; c.fillStyle = lg(c, 0, 100, 0, 180, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(255,230,160,.35)']]); c.fillRect(0, 0, W, 180);
      c.restore();
      c.save(); c.shadowColor = '#ffd23f'; c.shadowBlur = 30; c.strokeStyle = 'rgba(255,240,180,.9)'; c.lineWidth = 3; c.beginPath(); c.arc(sx, sy, R, 0, TAU); c.stroke(); c.restore();
      // แสงวาบ
      const P = 6, cyc = Math.floor(t / P), tt = t - cyc * P;
      if (tt < 1.2) { const r = rng(cyc * 5 + 9), x = 40 + r() * (W - 80), k = tt / 1.2;
        c.save(); c.globalCompositeOperation = 'lighter';
        c.fillStyle = rg(c, x, 165, 0, 60 + k * 160, [[0, `rgba(255,250,220,${0.8 * (1 - k)})`], [1, 'rgba(255,180,40,0)']]); c.fillRect(x - 230, 0, 460, 400);
        c.strokeStyle = `rgba(255,230,150,${0.6 * (1 - k)})`; c.lineWidth = 3; c.beginPath(); c.ellipse(x, 165, 30 + k * 200, 10 + k * 70, 0, 0, Math.PI); c.stroke();
        c.restore(); }
      // สะเก็ดไฟ
      c.save(); c.globalCompositeOperation = 'lighter';
      for (const e of S.embers) { const y = wrap(e.y + t * e.sp, H), x = e.x + Math.sin(t + e.p) * e.dx, a = 0.4 + 0.6 * Math.abs(Math.sin(t * 6 + e.p));
        c.fillStyle = `rgba(255,${180 + (e.s > 2 ? 60 : 0)},80,${a * 0.7})`; c.fillRect(x, y, e.s, e.s * 2.2); }
      c.restore();
      c.fillStyle = lg(c, 0, 200, 0, H, [[0, 'rgba(0,0,0,0)'], [0.4, 'rgba(10,3,0,.35)'], [1, 'rgba(0,0,0,.25)']]); c.fillRect(0, 200, W, H - 200);
      vignette(c, 0.45);
    } },
];

// ---------------------------------------------------------------- ตัวเกมจำลอง (ยานเรา ศัตรู กระสุน HUD)
let SHOW_GAME = true, SHOW_HUD = true;
function drawGame(c, t, sc) {
  const px = W / 2 + Math.sin(t * 0.9) * 80, py = H - 100;
  const ex = i => W * (0.22 + i * 0.28) + Math.sin(t * 0.8 + i * 2) * 26, ey = i => 120 + (i % 2) * 46 + Math.sin(t * 1.3 + i) * 8;
  const thick = sc.tag === 'EP5';
  // กระสุนศัตรู (แดง)
  for (let k = 0; k < 14; k++) {
    const i = k % 3, life = wrap(t * 0.32 + k * 0.071, 1), x = ex(i) + (k % 2 ? -1 : 1) * life * 60 * ((k % 4) / 3), y = ey(i) + 20 + life * 520;
    c.save(); c.shadowColor = '#ff3b3b'; c.shadowBlur = 10; c.fillStyle = '#ff3b3b'; c.beginPath(); c.arc(x, y, 4.5, 0, TAU); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#ffd0d0'; c.beginPath(); c.arc(x, y, 1.8, 0, TAU); c.fill();
    if (thick) { c.strokeStyle = '#ffffff'; c.lineWidth = 1.4; c.beginPath(); c.arc(x, y, 5.4, 0, TAU); c.stroke(); }
    c.restore();
  }
  // ศัตรู
  for (let i = 0; i < 3; i++) {
    c.save(); c.translate(ex(i), ey(i)); c.shadowColor = '#ff3df2'; c.shadowBlur = 12; c.strokeStyle = '#ff7af0'; c.lineWidth = 2; c.fillStyle = 'rgba(80,10,70,.8)';
    poly(c, [[0, 16], [16, -2], [10, -14], [0, -8], [-10, -14], [-16, -2]]); c.fill(); c.stroke(); c.restore();
  }
  // กระสุนเรา (ฟ้า)
  c.save(); c.shadowColor = '#36f1ff'; c.shadowBlur = 10; c.fillStyle = '#bff8ff';
  for (let k = 0; k < 9; k++) { const y = py - 24 - wrap(t * 520 + k * 62, 560); const x = W / 2 + Math.sin((t - (py - y) / 520) * 0.9) * 80; c.fillRect(x - 1.5, y, 3, 14); }
  c.restore();
  // ยานเรา
  c.save(); c.translate(px, py);
  c.globalCompositeOperation = 'lighter'; c.fillStyle = rg(c, 0, 22, 0, 16, [[0, 'rgba(255,255,255,.9)'], [0.4, 'rgba(54,241,255,.6)'], [1, 'rgba(54,241,255,0)']]); c.fillRect(-16, 10, 32, 32);
  c.globalCompositeOperation = 'source-over'; c.shadowColor = '#36f1ff'; c.shadowBlur = 14; c.strokeStyle = '#9ff8ff'; c.lineWidth = 2; c.fillStyle = 'rgba(10,40,70,.9)';
  poly(c, [[0, -22], [8, -4], [22, 12], [8, 10], [0, 16], [-8, 10], [-22, 12], [-8, -4]]); c.fill(); c.stroke(); c.restore();
}
function drawHud(c, sc) {
  c.save(); c.font = '700 15px "Chakra Petch", sans-serif'; c.fillStyle = '#ffffff'; c.shadowColor = '#000'; c.shadowBlur = 4;
  c.fillText('2,486,120', 12, 26); c.font = '500 10px "Chakra Petch", sans-serif'; c.fillStyle = 'rgba(255,255,255,.7)'; c.fillText('SCORE', 12, 40);
  c.textAlign = 'right'; c.font = '700 12px "Chakra Petch", sans-serif'; c.fillStyle = sc.color; c.fillText(sc.cur ? 'รอบ 1' : `${sc.tag} ${sc.name}`, W - 12, 24);
  c.textAlign = 'left'; c.fillStyle = '#ff5a6e'; c.font = '14px sans-serif'; c.fillText('♥ ♥ ♥', 12, H - 14);
  if (!sc.cur) { c.textAlign = 'right'; c.fillStyle = '#ffd23f'; c.font = '700 11px "Chakra Petch", sans-serif'; c.fillText('🧩 ถัดไป 4 ล้าน', W - 12, H - 16); }
  c.restore();
}

// ---------------------------------------------------------------- สร้างการ์ด + วนวาด
const cards = [];
const grid = document.getElementById('grid');
let zoomed = null;
SCENES.forEach(sc => {
  sc.S = sc.init();
  const card = document.createElement('div'); card.className = 'card'; card.style.setProperty('--ep', sc.color);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; card.append(cv);
  card.insertAdjacentHTML('beforeend', `<div class="body"><span class="tag ${sc.cur ? 'cur' : ''}">${sc.tag}</span><div class="name">${sc.name}</div><ul>${sc.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>`);
  cv.onclick = () => { zoomed = sc; document.getElementById('zoom').classList.add('on'); };
  grid.append(card); cards.push([cv, sc]);
});
document.getElementById('zoom').onclick = () => { zoomed = null; document.getElementById('zoom').classList.remove('on'); };
const tg = (id, set) => { const b = document.getElementById(id); b.onclick = () => { b.classList.toggle('on'); set(b.classList.contains('on')); }; };
tg('tgGame', v => SHOW_GAME = v); tg('tgHud', v => SHOW_HUD = v);
function render(cv, sc, t) {
  const c = cv.getContext('2d'), k = cv.width / W;
  c.setTransform(k, 0, 0, k, 0, 0);
  sc.draw(c, t, sc.S);
  if (SHOW_GAME) drawGame(c, t, sc);
  if (SHOW_HUD) drawHud(c, sc);
}
const loop = now => {
  const t = now / 1000;
  if (zoomed) render(document.getElementById('zoomCv'), zoomed, t);
  else for (const [cv, sc] of cards) { const r = cv.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) render(cv, sc, t); }
  requestAnimationFrame(loop);
};
document.fonts.ready.then(() => requestAnimationFrame(loop));
</script>
